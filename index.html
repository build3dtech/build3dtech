<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Build 3D Tech</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
      text-align: center;
    }

    .card {
      max-width: 430px;
      margin: 0 auto;
      background: white;
      padding: 30px 22px;
      border-radius: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .logo {
      width: 220px;
      max-width: 90%;
      height: auto;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0;
      font-size: 27px;
    }

    .location {
      margin: 5px 0 25px;
      color: #666;
      font-size: 15px;
    }

    .button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 16px 15px;

      border-radius: 12px;

      text-decoration: none;
      font-size: 17px;
      font-weight: bold;

      background: #111;
      color: white;

      transition: transform 0.1s, opacity 0.1s;
    }

    .button:active {
      transform: scale(0.98);
      opacity: 0.85;
    }

    .contact {
      background: #1565c0;
    }

    .whatsapp {
      background: #25D366;
    }

    .instagram {
      background: #C13584;
    }

    .tiktok {
      background: #111;
    }

    .facebook {
      background: #1877F2;
    }

    .email {
      background: #555;
    }

    .footer {
      margin-top: 25px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <video class="logo" autoplay muted loop playsinline poster="logo.png">
        <source src="logo.mp4" type="video/mp4">
    </video>

    <h1>Build 3D Tech</h1>

    <div class="location">
      Impressão 3D • Assis - SP
    </div>

    <a class="button contact"
       href="build3dtech.vcf">
       👤 Salvar Contato
    </a>

    <a class="button whatsapp"
       href="https://wa.me/5518996276052">
       💬 WhatsApp
    </a>

    <a class="button instagram"
       href="https://www.instagram.com/build3dtech/">
       📷 Instagram
    </a>

    <a class="button tiktok"
       href="https://www.tiktok.com/@build3dtech">
       ♪ TikTok
    </a>

    <a class="button facebook"
       href="https://www.facebook.com/profile.php?id=61593428612579">
       Facebook
    </a>

    <a class="button email"
       href="mailto:build3dtech@gmail.com">
       ✉️ E-mail
    </a>

    <div class="footer">
      Build 3D Tech • Impressão 3D
    </div>

  </div>

</body>
</html>
